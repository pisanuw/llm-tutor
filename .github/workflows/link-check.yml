# The live site's public links, weekly (docs/student-facing-review-2026-10.md,
# step 0.3): the login and help pages, the book and every chapter it links,
# the explorables, the external links in the Teach-me openers, and, with the
# admin token, that every lecture of both courses has its deck on the
# instance. A dead link fails the run and emails ADMIN_EMAILS.

name: link-check

on:
  schedule:
    - cron: "20 10 * * 2"   # Tuesdays 10:20 UTC: 03:20 PDT, 02:20 PST
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    # Crawls the repository variable SITE_URL; unset, the job is skipped.
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install httpx
        run: python -m pip install "httpx>=0.27"

      - name: Check the links
        env:
          BASE_URL: ${{ vars.SITE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: python -m scripts.link_check

      - name: Email alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE: ${{ vars.SITE_URL }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          key = os.environ.get("RESEND_API_KEY", "").strip()
          to = [e.strip() for e in os.environ.get("ADMIN_EMAILS", "").split(",") if e.strip()]
          if not key or not to:
              print("No RESEND_API_KEY/ADMIN_EMAILS secret; cannot email. The failed run is the only signal.")
              raise SystemExit(0)
          body = {
              "from": os.environ.get("FROM_EMAIL", "tutor@yourdomain.com"),
              "to": to,
              "subject": "[tutor] link-check: a link students can follow is dead",
              "text": ("The weekly crawl of " + os.environ["SITE"] + " found a dead link, a missing deck, "
                       "or could not reach the site. The run log names each one.\n\n"
                       "Run log: " + os.environ["RUN_URL"] + "\n"),
          }
          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(body).encode(),
              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
          )
          try:
              print("Resend response:", urllib.request.urlopen(req, timeout=15).status)
          except Exception as exc:
              print("the failure email itself failed:", exc)
          EOF
