# Nightly auditor (Session 22, Task 7): a Sonnet re-judge of recent turns.
#
# Runs against the production database (DATABASE_URL) with the auditor model. It
# never blocks the live pipeline; it writes JudgeSample rows and a dated report.
# The report names students only as s<id> and is kept as a 14-day workflow
# artifact. It is never committed: a push to main would redeploy production, and
# git history is out of reach of the erasure tooling. Hence contents: read.
# No-ops cleanly when ANTHROPIC_API_KEY or DATABASE_URL are unset (e.g. on
# forks), so it is safe to leave enabled.

name: audit

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily: 02:17 PDT, 01:17 PST
  workflow_dispatch:
    inputs:
      hours:
        description: "Look-back window in hours"
        default: "24"

# One run at a time: a run that starts while another is going waits for it
# (plan step 6.4, finding E19).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-web.txt
            requirements-dev.txt

      # The auditor runs through the pipeline CLI, which imports click and rich;
      # requirements-dev.txt pins them rather than trusting chromadb's
      # transitive ones (plan step 6.3).
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run auditor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$DATABASE_URL" ]; then
            echo "ANTHROPIC_API_KEY or DATABASE_URL not set; skipping audit."
            exit 0
          fi
          HOURS="${{ github.event.inputs.hours }}"
          # --allow-prod: this job is meant to write auditor rows to production.
          python -m pipeline audit-turns --hours "${HOURS:-24}" --allow-prod

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: turn-audit-${{ github.run_id }}
          path: docs/audit/20*.md
          retention-days: 14
          if-no-files-found: ignore
